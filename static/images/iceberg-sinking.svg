    <path d="M42 -18 C60 -40 90 -46 130 -58 M66 -18 C84 -36 110 -44 150 -52 M90 -18 C104 -32 130 -40 168 -44 M114 -18 C126 -28 146 -34 178 -36" stroke="#8a93a6" stroke-width="7" fill="none" stroke-linecap="round" opacity=".28" filter="url(#blur)"/>
