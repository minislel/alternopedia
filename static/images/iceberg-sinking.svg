<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d1f"/>
      <stop offset=".75" stop-color="#1b2a4d"/>
      <stop offset="1" stop-color="#2a3a5e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14254a"/>
      <stop offset="1" stop-color="#040915"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset=".55" stop-color="#cfe0f0"/>
      <stop offset="1" stop-color="#8fa9c4"/>
    </linearGradient>
    <linearGradient id="iceDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c2da"/>
      <stop offset="1" stop-color="#5f7d9c"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b8496" stop-opacity=".0"/>
      <stop offset=".3" stop-color="#7b8496" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7b8496" stop-opacity=".0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
