      <rect x="66" y="20" width="2" height="2"/><rect x="74" y="20" width="2" height="2"/><rect x="82" y="20" width="2" height="2"/>
      <rect x="90" y="20" width="2" height="2"/><rect x="98" y="20" width="2" height="2"/><rect x="106" y="20" width="2" height="2"/>
      <rect x="114" y="20" width="2" height="2"/><rect x="122" y="20" width="2" height="2"/><rect x="130" y="20" width="2" height="2"/>
      <rect x="14" y="30" width="1.6" height="1.6"/><rect x="22" y="30" width="1.6" height="1.6"/><rect x="30" y="30" width="1.6" height="1.6"/>
      <rect x="38" y="30" width="1.6" height="1.6"/><rect x="46" y="30" width="1.6" height="1.6"/><rect x="54" y="30" width="1.6" height="1.6"/>
