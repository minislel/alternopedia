    <circle cx="246" cy="48" r="1" opacity=".9"/><circle cx="288" cy="22" r=".6" opacity=".5"/><circle cx="318" cy="60" r=".8" opacity=".7"/>
    <circle cx="352" cy="18" r="1" opacity=".9"/><circle cx="382" cy="44" r=".7" opacity=".6"/><circle cx="36" cy="84" r=".6" opacity=".5"/>
